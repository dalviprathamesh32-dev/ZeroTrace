services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      RATE_LIMITER_REDIS_URL: redis://redis:6379/1
